name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v0.1.0"
        required: true
      release_name:
        description: "Optional release title"
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Publish Windows UI EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build data
        uses: Swatinem/rust-cache@v2

      - name: Resolve release metadata
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag_name }}"
            if ([string]::IsNullOrWhiteSpace($tag)) { throw "tag_name is required" }
            $name = "${{ inputs.release_name }}"
            if ([string]::IsNullOrWhiteSpace($name)) { $name = $tag }
          } else {
            $tag = "${{ github.ref_name }}"
            $name = $tag
          }

          $content = Get-Content -Raw -Path "Cargo.toml"
          $m = [regex]::Match($content, 'version\s*=\s*"([^"]+)"')
          if (-not $m.Success) { throw "Version not found in Cargo.toml" }
          $version = $m.Groups[1].Value

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "name=$name" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          TAG_NAME: ${{ steps.meta.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          $existing = git tag --list $env:TAG_NAME
          if (-not $existing) {
            git tag $env:TAG_NAME
            git push origin $env:TAG_NAME
          } else {
            Write-Host "Tag $env:TAG_NAME already exists"
          }

      - name: Build release EXE
        run: cargo build --release --locked

      - name: Prepare release files
        id: package
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG_NAME: ${{ steps.meta.outputs.tag }}
        run: |
          $exe = "target\release\vrc-ytdlp.exe"
          if (-not (Test-Path $exe)) { throw "Executable not found at $exe" }

          $dist = "dist"
          if (Test-Path $dist) { Remove-Item $dist -Recurse -Force }
          New-Item -ItemType Directory -Path $dist | Out-Null

          $releaseExe = Join-Path $dist "vrc-ytdlp-ui-windows-x64.exe"
          Copy-Item $exe $releaseExe

          $zipName = "vrc-ytdlp-ui-$env:TAG_NAME-windows-x64.zip"
          $zipPath = Join-Path $dist $zipName
          Compress-Archive -Path $releaseExe -DestinationPath $zipPath -Force

          $portableDir = Join-Path $dist "vrc-ytdlp-ui-portable"
          New-Item -ItemType Directory -Path $portableDir | Out-Null
          Copy-Item $releaseExe (Join-Path $portableDir "vrc-ytdlp.exe")
          Copy-Item "config.json" (Join-Path $portableDir "config.json")
          Copy-Item "setup.ps1" (Join-Path $portableDir "setup.ps1")

          $quickstart = @"
          vrc-ytdlp Portable Quick Start

          1. Double-click vrc-ytdlp.exe to open the UI.
          2. If yt-dlp is missing, the app will try to download it automatically.
          3. If you want ffmpeg and plugins prepared in advance, run setup.ps1 once.
          4. config.json can be edited from the UI or manually.
          "@
          Set-Content -Path (Join-Path $portableDir "QUICKSTART.txt") -Value $quickstart -Encoding utf8

          $portableZipName = "vrc-ytdlp-ui-portable-$env:TAG_NAME-windows-x64.zip"
          $portableZipPath = Join-Path $dist $portableZipName
          Compress-Archive -Path $portableDir -DestinationPath $portableZipPath -Force

          "exe_path=$releaseExe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "portable_zip_path=$portableZipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            ${{ steps.package.outputs.exe_path }}
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.portable_zip_path }}
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          files: |
            ${{ steps.package.outputs.exe_path }}
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.portable_zip_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
